# Manifeste Flatpak — front Linux GTK4 de Champinium.
#
# Patron « GNOME Rust app » : runtime GNOME + rustc installé via rustup au
# build (l'extension SDK rust-stable est trop ancienne pour la pile gtk-rs
# courante — voir le module ci-dessous), module unique compilant
# `champinium-linux` (feature `gui`).
#
# Choix de version : org.gnome.Platform/Sdk 48 (base freedesktop 24.08). À
# faire suivre lors des mises à jour GNOME — l'extension ffmpeg-full ci-dessous
# doit rester alignée sur la base freedesktop du runtime.
#
# Lecture H.264/AAC : le runtime GNOME embarque gstreamer1.0 core + plugins-base
# + plugins-good (VP8/VP9/Opus/WebM) ET le plugin gst-libav, mais ce dernier est
# lié à l'ffmpeg de base freedesktop, amputé des décodeurs sous brevet
# (H.264/AAC). L'extension `org.freedesktop.Platform.ffmpeg-full` (voir
# `add-extensions`) monte un ffmpeg complet dans `/app/lib/ffmpeg` et, via
# `add-ld-path`, le place en tête du LD_LIBRARY_PATH : gst-libav y trouve alors
# les décodeurs H.264/AAC. C'est le patron Flathub standard — les codecs
# encombrés de brevets sont distribués dans une extension séparée, jamais dans
# l'app. Le front est LECTURE seule (playbin GStreamer) : seul le décodage est
# requis, pas d'encodage dans le bac à sable. Champinium ingère en H.264/AAC
# (HLS), donc cette extension est nécessaire pour lire le propre contenu de
# l'app.
#
# Sources cargo : ce manifeste build avec `--share=network` pendant le module
# de compilation (cargo télécharge les crates depuis crates.io). C'est un
# ÉCART assumé par rapport au patron Flatpak/Flathub « correct » qui utiliserait
# des sources vendorisées hors-ligne (cargo-sources.json généré par
# flatpak-cargo-generator, cf. https://github.com/flatpak/flatpak-builder-tools).
# Le job CI qui construit ce manifeste a un accès réseau (runner GitHub Actions)
# donc `--share=network` au build fonctionne ; une VRAIE publication Flathub
# devra basculer sur les sources vendorisées pour la reproductibilité (Flathub
# l'exige pour les modules cargo). DIFFÉRÉ, suivi documenté dans
# docs/packaging.md — ce lot vise un Flatpak fonctionnel, pas une soumission
# Flathub.

app-id: org.champinium.Champinium
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: champinium

# Codecs sous brevet (H.264/AAC) fournis par une extension séparée, montée dans
# /app/lib/ffmpeg. `add-ld-path: .` (relatif au `directory`) préfixe le
# LD_LIBRARY_PATH → l'ffmpeg complet de l'extension prime sur celui du runtime,
# et le gst-libav du runtime y trouve les décodeurs. `version` alignée sur la
# base freedesktop du runtime GNOME 48 (24.08). Créé vide au build (mkdir
# ci-dessous) ; peuplé à l'installation par flatpak.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: "24.08"
    add-ld-path: .
    no-autodownload: false
    autodelete: false

# Permissions minimales pour un lecteur P2P (pas de --filesystem=host) :
# - réseau : libp2p (TCP/QUIC) parle au monde entier, pas de proxy possible.
# - wayland + fallback-x11 + dri : fenêtre GTK4 + rendu vidéo GStreamer (GL).
# - ipc : partagé par GStreamer/GTK pour certains plugins (memfd, shm).
# - pulseaudio : sortie audio de la lecture GStreamer.
#
# Persistance des données (identité Ed25519, blocs, `.seed_index`, etc.) :
# `champinium-core::paths::default_data_dir()` résout en
# `$XDG_DATA_HOME/champinium` (repli `~/.local/share/champinium`). Sous
# Flatpak, `XDG_DATA_HOME` est automatiquement redirigé par le sandbox vers
# `~/.var/app/org.champinium.Champinium/data` — AUCUNE permission
# `--filesystem` supplémentaire n'est nécessaire pour que l'identité/les blocs
# persistent : c'est déjà dans le bac à sable de l'app, entre relances. Donc
# pas de `--filesystem=xdg-download` ni `--filesystem=host` : l'app n'a
# aujourd'hui aucun besoin documenté de lire/écrire en dehors de son propre
# répertoire de données Flatpak.
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: champinium
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      # rustc via rustup plutôt que l'extension SDK rust-stable : la pile
      # gtk-rs courante (glib/gio-sys 0.22) exige rustc ≥ 1.92, or l'extension
      # rust-stable du SDK GNOME est figée en deçà (échec CI observé). Le
      # réseau étant déjà partagé au build (voir en-tête), on installe le
      # toolchain stable courant, garanti ≥ 1.92 (le job CI ubuntu compile la
      # même pile avec le rustc du runner). CARGO_HOME/RUSTUP_HOME dans le
      # répertoire de build pour rester dans le bac à sable de flatpak-builder.
      - |
        set -e
        export RUSTUP_HOME="$PWD/.rustup" CARGO_HOME="$PWD/.cargo"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
        export PATH="$CARGO_HOME/bin:$PATH"
        cargo build --release -p champinium-linux --features gui
      - install -Dm755 target/release/champinium /app/bin/champinium
      # Point de montage de l'extension ffmpeg-full (peuplé à l'installation).
      - mkdir -p /app/lib/ffmpeg
      # Icône : le SVG est la source de vérité, rasterisé au build (rsvg-convert
      # est dans org.gnome.Sdk) en PNG 128/256. appstreamcli compose exige une
      # icône RASTER trouvable (un SVG scalable seul échoue en
      # `file-read-error`/`filters-but-no-output` — cause du rouge CI initial).
      # 64x64 = taille MANDATAIRE du cache d'icônes AppStream. Sans elle,
      # appstreamcli compose peut lever file-read-error au lieu de downscaler.
      - rsvg-convert -w 64 -h 64 packaging/flatpak/org.champinium.Champinium.svg
        -o org.champinium.Champinium-64.png
      - install -Dm644 org.champinium.Champinium-64.png
        /app/share/icons/hicolor/64x64/apps/org.champinium.Champinium.png
      - rsvg-convert -w 128 -h 128 packaging/flatpak/org.champinium.Champinium.svg
        -o org.champinium.Champinium-128.png
      - install -Dm644 org.champinium.Champinium-128.png
        /app/share/icons/hicolor/128x128/apps/org.champinium.Champinium.png
      - rsvg-convert -w 256 -h 256 packaging/flatpak/org.champinium.Champinium.svg
        -o org.champinium.Champinium-256.png
      - install -Dm644 org.champinium.Champinium-256.png
        /app/share/icons/hicolor/256x256/apps/org.champinium.Champinium.png
      # SVG scalable conservé (sources vectorielles, thèmes à haute densité).
      - install -Dm644 packaging/flatpak/org.champinium.Champinium.svg
        /app/share/icons/hicolor/scalable/apps/org.champinium.Champinium.svg
      - install -Dm644 packaging/flatpak/org.champinium.Champinium.desktop
        /app/share/applications/org.champinium.Champinium.desktop
      - install -Dm644 packaging/flatpak/org.champinium.Champinium.metainfo.xml
        /app/share/metainfo/org.champinium.Champinium.metainfo.xml
      # DIAG TEMPORAIRE (à retirer) — surface le {{fname}} du file-read-error
      # d'appstreamcli compose, que le résumé CI ne montre pas.
      - |
        echo "===== DIAG icons (taille/type) ====="
        ls -la /app/share/icons/hicolor/*/apps/ 2>&1 || true
        file /app/share/icons/hicolor/*/apps/* 2>&1 || true
        echo "===== DIAG desktop ====="
        cat /app/share/applications/org.champinium.Champinium.desktop || true
        echo "===== DIAG metainfo validate ====="
        appstreamcli validate --no-net /app/share/metainfo/org.champinium.Champinium.metainfo.xml 2>&1 || true
        echo "===== DIAG compose --verbose (reproduit le file-read-error avec fname) ====="
        mkdir -p /tmp/ascr /tmp/ascd /tmp/asci
        appstreamcli compose --verbose --prefix=/ --result-root=/tmp/ascr \
          --data-dir=/tmp/ascd --icons-dir=/tmp/asci \
          --origin=diag /app 2>&1 | tail -40 || true
        echo "----- ISSUE REPORT FILES (contiennent le fname substitué) -----"
        find /tmp/ascr /tmp/ascd -type f 2>/dev/null | head -20
        for f in $(find /tmp/ascr /tmp/ascd -type f \( -name '*.yml' -o -name '*.yaml' -o -name '*.html' -o -name '*.xml' \) 2>/dev/null | head -5); do
          echo "--- $f ---"; sed 's/<[^>]*>//g' "$f" | grep -viE '^\s*$' | head -40
        done
        echo "===== DIAG END ====="
        true
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - dist
          - apps/macos/.build
          - apps/windows/**/bin
          - apps/windows/**/obj
